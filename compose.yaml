services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbox-integrated:bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHATBOX_WEB_PORT:-1212}:1212"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /var/lib/chatbox
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1212/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3