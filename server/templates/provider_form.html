{% extends 'base.html' %}
{% block content %}
<p><a href="{{ url_for('admin',tab='models') }}">← 返回模型管理</a></p>
<section class="form-card">
  <h2>{{ '编辑' if editing else '新增' }}提供商</h2>
  {% if error %}<p class="error" role="alert">{{ error }}（未保存）</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>提供商 ID<input name="provider" value="{{ value.provider }}" maxlength="80" pattern="[A-Za-z0-9_\-]+" required placeholder="例如 openai 或 my-provider"></label>
    <p class="muted">须与客户端的提供商标识一致。这里只管理目录，不设置 API 地址和密钥。</p>
    <label>显示名称<input name="groupName" value="{{ value.groupName }}" maxlength="200" required placeholder="例如我的模型服务"></label>
    <button class="primary" type="submit">保存提供商</button> <a class="button" href="{{ url_for('admin',tab='models') }}">取消</a>
  </form>
  {% if editing %}<details><summary>删除提供商</summary><form class="danger-zone" action="{{ url_for('delete_provider',provider=original_provider) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p>删除提供商将同时删除其目录下所有模型条目，不会删除客户端会话。</p><label><input type="checkbox" name="confirm" required>确认删除该提供商及全部模型条目</label><button class="danger" type="submit">删除提供商</button></form></details>{% endif %}
</section>
{% endblock %}
